<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="wrapper">
      <div class="inp__data">
        <h1>GET IN TOUCH</h1>

        <form class="inp">
          <label for="">Tell us your name</label>
          <input
            type="text"
            name="name"
            id="name"
            class="names"
            placeholder="Enter your name"
          />

          <label for="">Enter your email</label>
          <input
            type="email"
            name="email"
            id="email"
            class="email"
            placeholder="Enter your email"
          />

          <label for="">Your Phone Number</label>
          <input
            type="tel"
            name="tel"
            id="tel"
            class="tel"
            placeholder="Enter your number"
          />

          <label for="">Message</label>
          <input
            type="text"
            name=""
            id=""
            class="text"
            placeholder="Your message here..."
          />
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <div class="table">
      <table border="1">
        <thead>
          <tr>
            <th>N*</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Message</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
