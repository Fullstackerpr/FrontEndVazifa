<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="wrapper">
        <button class="number">12345</button>
        <div class="navbar">
            <button class="percent">%</button>
            <button class="root">&</button>
            <button class="back">CE</button>
            <button class="delete">C</button>
        </div>

        <div class="navbar_two">
            <button class="num_seven">7</button>
            <button class="num_eight">8</button>
            <button class="num_nine">9</button>
            <button class="minus">-</button>
        </div>

        <div class="navbar_three">
            <button class="num_four">4</button>
            <button class="num_five">5</button>
            <button class="num_six">6</button>
            <button class="division">/</button> 
        </div>

        <div class="navbar_four">
            <button class="num_one">1</button>
            <button class="num_two">2</button>
            <button class="num_three">4</button>
            <button class="multiply">x</button>
        </div>
        <div class="navbar_five">
            <button class="dot">.</button>
            <button class="num_zero">0</button>
            <button class="equal">=</button>
            <button class="plus">+</button>
        </div>
    </div>
</body>
</html>
